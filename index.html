<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triangle Image Fitter</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<header>
  <h1>▲ Triangle Image Fitter</h1>
  <p class="subtitle">Clip images to a triangle shape at 451 × 225 px</p>
</header>

<main class="container">

  <label class="drop-zone" id="dropZone" for="fileInput">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M19.35 10.04A7.49 7.49 0 0012 4C9.11 4 6.6 5.64 5.35 8.04A5.994
               5.994 0 000 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24
               5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
    </svg>
    <p><strong>Drop an image here</strong> or click to browse</p>
    <input type="file" id="fileInput" accept="image/*">
  </label>

  <section class="controls">

    <fieldset class="control-group">
      <legend>Triangle Direction</legend>
      <div class="triangle-options" id="triOptions">

        <button class="tri-option active" data-dir="up" title="Point Up" type="button">
          <svg viewBox="0 0 30 30" aria-hidden="true">
            <polygon points="15,4 28,26 2,26" fill="none" stroke-width="2"/>
          </svg>
        </button>

        <button class="tri-option" data-dir="down" title="Point Down" type="button">
          <svg viewBox="0 0 30 30" aria-hidden="true">
            <polygon points="15,26 28,4 2,4" fill="none" stroke-width="2"/>
          </svg>
        </button>

        <button class="tri-option" data-dir="left" title="Point Left" type="button">
          <svg viewBox="0 0 30 30" aria-hidden="true">
            <polygon points="4,15 26,2 26,28" fill="none" stroke-width="2"/>
          </svg>
        </button>

        <button class="tri-option" data-dir="right" title="Point Right" type="button">
          <svg viewBox="0 0 30 30" aria-hidden="true">
            <polygon points="26,15 4,2 4,28" fill="none" stroke-width="2"/>
          </svg>
        </button>

      </div>
    </fieldset>

    <!-- Shown only after an image is loaded -->
    <div class="control-group hidden" id="zoomControl">
      <label for="zoomSlider">Zoom</label>
      <input type="range" id="zoomSlider" min="0.5" max="3" step="0.01" value="1">
      <output id="zoomLabel" for="zoomSlider">100%</output>
      <button class="btn-secondary btn-sm" id="resetBtn" type="button">Reset</button>
    </div>

  </section>

  <section class="preview-area hidden" id="previewArea">

    <figure class="preview-card">
      <figcaption>Original</figcaption>
      <img id="originalPreview" alt="Original image preview">
      <p class="info-bar" id="originalInfo"></p>
    </figure>

    <figure class="preview-card">
      <figcaption>Triangle Result — drag to pan</figcaption>
      <canvas id="resultCanvas"></canvas>
      <p class="info-bar" id="resultInfo"></p>
    </figure>

  </section>

  <div class="controls hidden" id="downloadArea">
    <button class="btn-primary"   id="downloadPng"  type="button">Download PNG</button>
    <button class="btn-secondary" id="downloadWebp" type="button">Download WebP</button>
    <button class="btn-secondary" id="downloadPdf"  type="button">Download Chart PDF</button>
  </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
